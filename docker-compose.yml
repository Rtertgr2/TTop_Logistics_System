services:
  db:
    image: postgres:16-alpine
    container_name: logistics-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistics}
      POSTGRES_USER: ${POSTGRES_USER:-logistics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logistics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logistics-backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-logistics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-logistics}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_DEFAULT_USER_ID: ${LINE_DEFAULT_USER_ID}
      DEPOT_ADDRESS: ${DEPOT_ADDRESS}
      DEPOT_LAT: ${DEPOT_LAT:-13.781882}
      DEPOT_LNG: ${DEPOT_LNG:-100.425041}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      API_KEYS: ${API_KEYS}
      ADMIN_KEYS: ${ADMIN_KEYS}
      DISPATCHER_KEYS: ${DISPATCHER_KEYS}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/data:/app/data
    networks:
      - logistics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logistics-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - logistics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  logistics-network:
    driver: bridge

volumes:
  postgres_data:
