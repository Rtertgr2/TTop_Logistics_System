apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: logistics
  labels:
    app: logistics
    component: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logistics
      component: celery-worker
  template:
    metadata:
      labels:
        app: logistics
        component: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: image-registry.openshift-image-registry.svc:5000/logistics/backend:latest
          command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          env:
            - name: DATABASE_URL
              value: "postgresql://logistics:$(POSTGRES_PASSWORD)@postgresql:5432/logistics"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: JWT_SECRET_KEY
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: GOOGLE_MAPS_API_KEY
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: REDIS_PASSWORD
            - name: PRODUCTION_MODE
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: PRODUCTION_MODE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: LOG_LEVEL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
