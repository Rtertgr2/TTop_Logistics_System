apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: logistics
  labels:
    app: logistics
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logistics
      component: frontend
  template:
    metadata:
      labels:
        app: logistics
        component: frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/logistics/frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: logistics
  labels:
    app: logistics
    component: frontend
spec:
  selector:
    app: logistics
    component: frontend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: logistics
  labels:
    app: logistics
    component: frontend
spec:
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
