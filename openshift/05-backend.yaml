apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data-pvc
  namespace: logistics
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: logistics
  labels:
    app: logistics
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logistics
      component: backend
  template:
    metadata:
      labels:
        app: logistics
        component: backend
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/logistics/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://logistics:$(POSTGRES_PASSWORD)@postgresql:5432/logistics"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: JWT_SECRET_KEY
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: GOOGLE_MAPS_API_KEY
            - name: LINE_CHANNEL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: LINE_CHANNEL_ACCESS_TOKEN
            - name: LINE_CHANNEL_SECRET
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: LINE_CHANNEL_SECRET
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: API_KEYS
            - name: ADMIN_KEYS
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: ADMIN_KEYS
            - name: DISPATCHER_KEYS
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: DISPATCHER_KEYS
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logistics-secrets
                  key: REDIS_PASSWORD
            - name: DEPOT_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: DEPOT_ADDRESS
            - name: DEPOT_LAT
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: DEPOT_LAT
            - name: DEPOT_LNG
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: DEPOT_LNG
            - name: MAX_FILE_SIZE_MB
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: MAX_FILE_SIZE_MB
            - name: PRODUCTION_MODE
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: PRODUCTION_MODE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: LOG_LEVEL
            - name: LOG_JSON
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: LOG_JSON
            - name: RATE_LIMIT_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: RATE_LIMIT_PER_MINUTE
            - name: SOLVE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: SOLVE_TIMEOUT_SECONDS
            - name: MAX_ROUTE_DISTANCE_KM
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: MAX_ROUTE_DISTANCE_KM
            - name: AVG_SPEED_KMH
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: AVG_SPEED_KMH
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: ALLOWED_ORIGINS
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: backend-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: logistics
  labels:
    app: logistics
    component: backend
spec:
  selector:
    app: logistics
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
