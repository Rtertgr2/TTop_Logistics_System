apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: backend
  namespace: logistics
  labels:
    app: logistics
    component: backend
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: frontend
  namespace: logistics
  labels:
    app: logistics
    component: frontend
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: backend
  namespace: logistics
  labels:
    app: logistics
    component: backend
spec:
  source:
    type: Git
    git:
      uri: "https://github.com/YOUR_ORG/Logistics_System.git"
      ref: "main"
    contextDir: "backend"
  strategy:
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: python:3.11
        namespace: openshift
  output:
    to:
      kind: ImageStreamTag
      name: backend:latest
  triggers:
    - type: ConfigChange
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: frontend
  namespace: logistics
  labels:
    app: logistics
    component: frontend
spec:
  source:
    type: Git
    git:
      uri: "https://github.com/YOUR_ORG/Logistics_System.git"
      ref: "main"
    contextDir: "frontend"
  strategy:
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: nodejs:20-ubi8
        namespace: openshift
  output:
    to:
      kind: ImageStreamTag
      name: frontend:latest
  triggers:
    - type: ConfigChange
